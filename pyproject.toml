[project]
name = "consentgate"
version = "0.1.0"
description = "Fail-closed, evidence-bound data-use authorization on GenLayer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "genlayer-py==0.16.3",
  "genlayer-test==0.29.2",
  "genvm-linter==0.11.0",
  "pyright==1.1.411",
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
